# Chi ap dung khi chay profile b09 o local.
spring.datasource.url=jdbc:h2:file:./.local-data/b09/supplychain
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql,file:./database/b09-seed.sql,file:./database/b09-seed-reports.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
app.security.bootstrap-admin-username=b08_admin
app.security.bootstrap-admin-password=${B09_ADMIN_PASSWORD:}
app.reporting.cache.enabled=true
app.reporting.cache.maximum-size=100
app.reporting.cache.ttl-seconds=60
