<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo nhập, xuất, chuyển kho</title>
<link rel="stylesheet" href="/reports.css">
</head>
<body>
<main>
<header>
  <h1>Báo cáo kho</h1>
  <div id="userBox"></div>
</header>

<section id="loginCard" class="card" hidden>
  <p class="login-intro">Đăng nhập để xem báo cáo.</p>
  <div class="grid">
    <div><label for="lu">Tên đăng nhập</label><input id="lu" type="text" autocomplete="username"></div>
    <div><label for="lp">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password"></div>
    <div><button id="loginBtn" type="button">Đăng nhập</button></div>
  </div>
  <p id="loginErr" class="err" role="alert"></p>
</section>

<div class="tabs" role="tablist" id="tabs"></div>

<div id="demoBanner" class="banner" hidden>DỮ LIỆU MẪU – lấy từ JSON mẫu trong tài liệu, không phải từ API. Không dùng làm minh chứng.</div>

<section class="card">
  <div class="grid">
    <div><label for="fFrom">Từ ngày</label><input id="fFrom" type="date" value="2026-10-14"></div>
    <div><label for="fTo">Đến ngày</label><input id="fTo" type="date" value="2026-10-15"></div>
    <div><button id="applyBtn" type="button">Xem báo cáo</button></div>
  </div>
  <label class="demo-option"><input id="demoChk" type="checkbox"> Chế độ dữ liệu mẫu (chỉ để thử giao diện)</label>
</section>

<section class="card">
  <p id="status" role="status"></p>
  <div id="content" hidden>
    <div class="sum">
      <div><b id="sumQty">0</b><span>Tổng số lượng ghi nhận</span></div>
      <div><b id="sumRows">0</b><span>Số dòng dữ liệu</span></div>
    </div>
    <p class="note">Tổng lượng chưa quy đổi đơn vị: nếu các sản phẩm có đơn vị khác nhau thì tổng chỉ mang tính tham khảo.</p>
    <p id="mismatch" class="warn" role="alert" hidden></p>
    <div class="chart" id="chartBox"><canvas id="chart" aria-label="Biểu đồ báo cáo"></canvas></div>
    <div class="wrap report-table">
      <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
    </div>
  </div>
  <p><button id="csvBtn" type="button" class="ghost" disabled>Xuất Excel (.xlsx)</button></p>
</section>
</main>

<script src="/vendor/chart-4.4.1.umd.min.js"></script>
<script src="/vendor/xlsx-0.20.3.full.min.js"></script>
<script src="/reports.js" defer></script>
</body>
</html>
