<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tra cứu nhật ký hệ thống</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 1200px;
            margin: auto;
        }

        section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        form, .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input, select, button {
            padding: 9px;
            font: inherit;
            border: 1px solid #b8c2d0;
            border-radius: 5px;
        }

        button {
            cursor: pointer;
            background: #175cd3;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #d9d9d9;
            padding: 10px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            background: #e7eef8;
        }

        #message {
            white-space: pre-wrap;
        }

        .error {
            color: #b42318;
        }

        .controls {
            margin-top: 16px;
            align-items: center;
        }
    </style>
</head>
<body>
<main>
    <h1>Tra cứu nhật ký hệ thống</h1>
    <p>Tra cứu người thực hiện, hành động, đối tượng và thời điểm.</p>

    <section>
        <form id="loginForm">
            <label>
                Tài khoản
                <input id="loginUsername"
                       autocomplete="username" required>
            </label>

            <label>
                Mật khẩu
                <input id="loginPassword" type="password"
                       autocomplete="current-password" required>
            </label>

            <button type="submit">Đăng nhập</button>
        </form>

        <p id="accountStatus">Chưa đăng nhập tại trang này.</p>
        <button id="logoutButton" type="button">Đăng xuất</button>
    </section>

    <section>
        <h2>Bộ lọc nhật ký</h2>

        <form id="filterForm">
            <label>
                Người thực hiện
                <input id="username" placeholder="Ví dụ b07_test">
            </label>

            <label>
                Hành động
                <select id="action">
                    <option value="">Tất cả</option>
                    <option value="LOGIN_SUCCESS">Đăng nhập thành công</option>
                    <option value="ROLE_CHANGE">Đổi vai trò</option>
                    <option value="DELETE_PRODUCT">Xóa sản phẩm</option>
                </select>
            </label>

            <label>
                Từ thời điểm
                <input id="fromTime" type="datetime-local" step="1">
            </label>

            <label>
                Đến thời điểm
                <input id="toTime" type="datetime-local" step="1">
            </label>

            <label>
                Số dòng mỗi trang
                <select id="size">
                    <option value="2">2</option>
                    <option value="5">5</option>
                    <option value="20" selected>20</option>
                    <option value="100">100</option>
                </select>
            </label>

            <button type="submit">Tra cứu</button>
            <button id="resetButton" type="button">Xóa bộ lọc</button>
        </form>

        <p>Thời gian theo giờ lưu trong ứng dụng, gồm cả hai mốc biên.</p>
    </section>

    <section>
        <p id="message" role="status" aria-live="polite"></p>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Người thực hiện</th>
                    <th>Hành động</th>
                    <th>Đối tượng</th>
                    <th>Thời điểm</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>

        <div class="controls">
            <button id="previousButton" type="button" disabled>
                Trang trước
            </button>
            <span id="pageInfo">Chưa tải dữ liệu</span>
            <button id="nextButton" type="button" disabled>
                Trang sau
            </button>
        </div>
    </section>
</main>

<script>
    const element = id => document.getElementById(id);
    let currentPage = 0;
    let activeFilters = new URLSearchParams({size: "20"});
    let busy = false;

    function showMessage(text, error = false) {
        element("message").textContent = text;
        element("message").className = error ? "error" : "";
    }

    function clearResults() {
        element("rows").replaceChildren();
        element("pageInfo").textContent = "Chưa có kết quả";
        element("previousButton").disabled = true;
        element("nextButton").disabled = true;
    }

    async function request(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            credentials: "same-origin"
        });

        if (response.status === 401) {
            throw new Error("HTTP 401 — Vui lòng đăng nhập.");
        }

        if (response.status === 403) {
            throw new Error(
                "HTTP 403 — Không đủ quyền xem nhật ký. Yêu cầu ADMIN.");
        }

        if (!response.ok) {
            let message = `HTTP ${response.status}`;
            try {
                const error = await response.json();
                if (error.message) message += " — " + error.message;
            } catch (_) {
                // Giữ thông báo HTTP nếu phản hồi không phải JSON.
            }
            throw new Error(message);
        }

        return response;
    }

    async function loadPage(page) {
        if (busy) return;
        busy = true;
        clearResults();
        showMessage("Đang tải nhật ký...");

        try {
            const params = new URLSearchParams(activeFilters);
            params.set("page", page);

            const response = await request(
                "/api/admin/audit-logs?" + params.toString());
            const data = await response.json();

            for (const log of data.content) {
                const row = document.createElement("tr");

                for (const value of [
                    log.id,
                    log.username,
                    log.action,
                    log.entityName,
                    log.createdAt
                ]) {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                }

                element("rows").appendChild(row);
            }

            currentPage = data.page;

            element("pageInfo").textContent = data.totalPages === 0
                ? "0 bản ghi — 0 trang"
                : `Trang ${data.page + 1}/${data.totalPages}`
                  + ` — Tổng ${data.totalElements} bản ghi`;

            element("previousButton").disabled =
                data.first || data.totalPages === 0;
            element("nextButton").disabled = data.last;

            showMessage(data.content.length
                ? "HTTP 200 — Tải nhật ký thành công."
                : "HTTP 200 — Không có nhật ký phù hợp.");
        } catch (error) {
            clearResults();
            showMessage(error.message, true);
        } finally {
            busy = false;
        }
    }

    element("loginForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        clearResults();

        const username = element("loginUsername").value.trim();
        const password = element("loginPassword").value;
        element("loginPassword").value = "";

        try {
            // Kết thúc phiên cũ trước khi thử tài khoản khác.
            await request("/api/auth/logout", {method: "POST"});
            element("accountStatus").textContent = "Chưa đăng nhập.";

            const response = await request("/api/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });

            const account = await response.json();

            element("accountStatus").textContent =
                `Đã đăng nhập: ${account.username} — ${account.role}`;

            await loadPage(0);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    element("logoutButton").addEventListener("click", async () => {
        if (busy) return;

        try {
            await request("/api/auth/logout", {method: "POST"});
            clearResults();
            element("loginPassword").value = "";
            element("accountStatus").textContent = "Đã đăng xuất.";
            showMessage("Đã kết thúc phiên đăng nhập.");
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    element("filterForm").addEventListener("submit", event => {
        event.preventDefault();
        if (busy) return;

        const fromTime = element("fromTime").value;
        const toTime = element("toTime").value;

        if (fromTime && toTime && fromTime > toTime) {
            clearResults();
            showMessage(
                "Thời điểm bắt đầu phải nhỏ hơn hoặc bằng thời điểm kết thúc.",
                true);
            return;
        }

        activeFilters = new URLSearchParams();

        for (const key of [
            "username", "action", "fromTime", "toTime", "size"
        ]) {
            const value = element(key).value.trim();
            if (value) activeFilters.set(key, value);
        }

        loadPage(0);
    });

    element("resetButton").addEventListener("click", () => {
        if (busy) return;
        element("filterForm").reset();
        activeFilters = new URLSearchParams({size: "20"});
        loadPage(0);
    });

    element("previousButton").addEventListener("click", () => {
        loadPage(currentPage - 1);
    });

    element("nextButton").addEventListener("click", () => {
        loadPage(currentPage + 1);
    });
</script>
</body>
</html>
