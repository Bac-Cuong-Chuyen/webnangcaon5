spring.application.name=supply-chain-management

spring.datasource.url=jdbc:h2:mem:supplychain;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.upload.directory=uploads
app.upload.max-bytes=1048576

# B09 public origin: set PUBLIC_BASE_URL to the real HTTPS origin on deployment.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}
# Compress public HTML/assets/XML; private JSON API responses are not included.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/xml,text/xml
